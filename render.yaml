services:
  - type: web
    name: retail-news-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m playwright install chromium chromium-headless-shell
    # --worker-class gthread --threads 8: without this, gunicorn defaults to
    # a single synchronous worker, meaning the whole server handles exactly
    # one HTTP request at a time no matter how many the browser fires in
    # parallel -- a 40-50 row bulk-assign (each request already needing a
    # couple of DB round-trips) was getting fully serialized on top of that.
    # Threads (not more worker *processes*) to stay within the free tier's
    # memory budget -- each full process would separately load Crawl4AI/
    # Playwright, which is heavy; psycopg2's pool is already thread-safe.
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --worker-class gthread --workers 1 --threads 8
    envVars:
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: "6543"
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: FLASK_DEBUG
        value: "false"
      # Install/launch browsers from inside the app's own site-packages dir
      # instead of the OS-level ~/.cache — that cache can end up owned by a
      # different user/path at runtime than during build, which is why the
      # browser Crawl4AI launches can go missing even though the build step
      # reported it installed successfully.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
