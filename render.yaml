services:
  - type: web
    name: retail-news-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m playwright install --with-deps chromium
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        value: "6543"
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: FLASK_DEBUG
        value: "false"
