name: Scraper - Restaurant News (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scrapers
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Set Chrome paths
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install selenium beautifulsoup4 requests pandas openpyxl webdriver-manager "supabase>=2.0.0,<3.0.0" \
            "langchain-groq>=0.1.0,<0.4.0" "langchain-core>=0.2.0,<0.4.0"

      - name: Run restaurant scraper
        run: python restaurant_scraper.py

      - name: Run Groq extraction
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: |
          if [ -z "${GROQ_API_KEYS}" ]; then
            echo "GROQ_API_KEYS secret not configured — skipping AI extraction step"
            exit 0
          fi
          python restaurant_auto_extract.py

      - name: Load into dashboard (store_events / scraped_articles)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python load_extraction_to_dashboard.py restaurant

      - name: Sync master file to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_to_supabase.py

      - name: Commit and push JSON + CSV
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scrapers/restaurant_latest.json || true
          git add scrapers/restaurant_extraction_latest.json || true
          git add scrapers/data/restaurant/ || true
          git add scrapers/master_file/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: restaurant update $(date -u '+%Y-%m-%d %H:%M UTC')"
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin master && git push origin master; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed, retrying in 15s..."
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            if [ "$pushed" != true ]; then
              echo "::error::All push attempts failed — scraped data was NOT saved to the repo."
              exit 1
            fi
          fi
