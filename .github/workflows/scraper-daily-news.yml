name: Scraper - Daily Retail News

on:
  schedule:
    - cron: '35 21 * * *'  # 3:05 AM IST daily (matches the original project's schedule)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser pandas python-dateutil requests python-dotenv googlenewsdecoder openpyxl "supabase>=2.0.0,<3.0.0" \
            "langchain-groq>=0.1.0,<0.4.0" "langchain-core>=0.2.0,<0.4.0" beautifulsoup4

      - name: Run scraper (opening keywords)
        run: python daily_news_articles.py --mode opening

      - name: Run scraper (closing keywords)
        run: python daily_news_articles.py --mode closing

      - name: Merge results
        run: python merge_results.py

      - name: Run extraction and load into dashboard (Groq AI)
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEYS_2: ${{ secrets.GROQ_API_KEYS_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "${GROQ_API_KEYS}" ] && [ -z "${GROQ_API_KEYS_2}" ]; then
            echo "No GROQ_API_KEYS/GROQ_API_KEYS_2 secret configured — skipping AI extraction step"
            exit 0
          fi
          python groq_extract_and_load.py daily_news docs/news_data.json

      - name: Sync master file to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_to_supabase.py

      - name: Commit and push changes
        working-directory: .
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scrapers/docs/news_data*.json || true
          git add scrapers/daily_news_extraction_latest.md || true
          git add scrapers/daily_news_groq_state.json || true
          git add scrapers/master_file/daily_news_master.csv || true
          git diff --staged --quiet || git commit -m "Auto-update: Daily news fetch $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --no-rebase -X ours origin master && git push origin master; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$pushed" != true ]; then
            echo "::error::All push attempts failed — scraped data was NOT saved to the repo."
            exit 1
          fi
