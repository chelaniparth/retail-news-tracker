name: Scraper - Business Debut

on:
  schedule:
    - cron: '0 21 * * *'  # 2:30 AM IST daily (matches the original project's schedule)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 pandas "supabase>=2.0.0,<3.0.0" \
            "langchain-groq>=0.1.0,<0.4.0" "langchain-core>=0.2.0,<0.4.0"

      - name: Run Business Debut scraper
        run: python businessdebut_scraper.py

      - name: Run extraction and load into dashboard (Groq AI)
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEYS_2: ${{ secrets.GROQ_API_KEYS_2 }}
          GROQ_API_KEYS_3: ${{ secrets.GROQ_API_KEYS_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "${GROQ_API_KEYS}" ] && [ -z "${GROQ_API_KEYS_2}" ] && [ -z "${GROQ_API_KEYS_3}" ]; then
            echo "No GROQ_API_KEYS/GROQ_API_KEYS_2/GROQ_API_KEYS_3 secret configured — skipping AI extraction step"
            exit 0
          fi
          python groq_extract_and_load.py businessdebut businessdebut_latest.json

      - name: Sync master file to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_to_supabase.py

      - name: Commit and push changes
        working-directory: .
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scrapers/businessdebut_latest.json || true
          git add scrapers/businessdebut_extraction_latest.md || true
          git add scrapers/businessdebut_groq_state.json || true
          git add scrapers/data/businessdebut/ || true
          git add scrapers/master_file/ || true
          git diff --staged --quiet || git commit -m "Auto-update: Business Debut fetch $(date +'%Y-%m-%d')"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin master && git push origin master; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          if [ "$pushed" != true ]; then
            echo "::error::All push attempts failed — scraped data was NOT saved to the repo."
            exit 1
          fi
